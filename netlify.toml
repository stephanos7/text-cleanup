[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/state"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/state/"
  [headers.values]
    X-Robots-Tag = "noindex"

[[redirects]]
  from = "/state"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/state/"
  to = "/index.html"
  status = 200
